<svg xmlns="http://www.w3.org/2000/svg" width="900" height="369" viewBox="0 0 900 369" role="img" aria-label="2Much2Read: A local-first pipeline that reads selected Gmail newsletters, extracts and ranks stories with three local models, folds duplicate coverage together, and posts one daily digest to a private Discord channel. Sandboxed systemd runtime, SSRF-safe link following, and weekly mutation testing. Flow: Gmail / Hacker News → Ollama Extract → Reranker → Review &amp; Merge → Discord Digest. Tags: Python, Ollama, sentence-transformers, Gmail API, SQLite, systemd, Mutation Testing.">
  <title>2Much2Read: A local-first pipeline that reads selected Gmail newsletters, extracts and ranks stories with three local models, folds duplicate coverage together, and posts one daily digest to a private Discord channel. Sandboxed systemd runtime, SSRF-safe link following, and weekly mutation testing. Flow: Gmail / Hacker News → Ollama Extract → Reranker → Review &amp; Merge → Discord Digest. Tags: Python, Ollama, sentence-transformers, Gmail API, SQLite, systemd, Mutation Testing.</title>
