<svg xmlns="http://www.w3.org/2000/svg" width="900" height="405" viewBox="0 0 900 405" role="img" aria-label="Stolen Szechuan Sauce: A solo DFIR investigation of DFIR Madness Case 001: an RDP intrusion, malware persistence, lateral movement, and data theft rebuilt across a Windows domain controller and desktop from disk images, event logs, registry hives, and a packet capture. Flow: RDP Brute Force → Metasploit Service → C2 over 443 → Secret.zip Exfiltration → Pivot to Desktop. Tags: FTK Imager, Autopsy, Wireshark, Registry Explorer, EvtxECmd, MFTECmd, Timeline Explorer.">
