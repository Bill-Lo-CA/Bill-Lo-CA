<svg xmlns="http://www.w3.org/2000/svg" width="900" height="372" viewBox="0 0 900 372" role="img" aria-label="Bill Lo — Software Engineering, Applied AI, Security Operations. Building defensible software, local AI tools, and security workflows. Open to SOC Analyst, Software Engineer, and AI / Automation roles; Kanata, Ontario, open to relocation across Canada.">
  <title>Bill Lo — Software Engineering, Applied AI, Security Operations. Building defensible software, local AI tools, and security workflows. Open to SOC Analyst, Software Engineer, and AI / Automation roles; Kanata, Ontario, open to relocation across Canada.</title>
  <style>
